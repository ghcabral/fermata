# Põe no ar a web (fermata-web.zip) de cada Release publicado.
name: Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - run: gh release download --repo "$GITHUB_REPOSITORY" --pattern fermata-web.zip
        env:
          GH_TOKEN: ${{ github.token }}
      - run: mkdir site && unzip -q fermata-web.zip -d site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
